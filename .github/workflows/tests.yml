name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # release.yml runs these jobs on the tagged commit before it publishes
  workflow_call:
  # Mondays 04:17 UTC: the ltr, stable and nightly images move between pushes
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the zip every other job tests, scans or publishes
  zip:
    name: release zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: cadex

      - name: Build the release zip
        run: python3 cadex/scripts/build_zip.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: cadex-release-zip
          path: dist/cadex.*.zip
          if-no-files-found: error

  tests:
    name: tests (${{ matrix.image }})
    needs: zip
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ${{ matrix.image }}
    # nightly is the master build: its failures fail the weekly run only
    continue-on-error: ${{ matrix.experimental && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.34 is qgisMinimumVersion, 3.40 the long-term release before the current one,
        # ltr the current long-term release, stable the current release (QGIS 4, Qt6)
        image:
          - "qgis/qgis:3.34"
          - "qgis/qgis:3.40"
          - "qgis/qgis:ltr"
          - "qgis/qgis:stable"
        experimental: [false]
        include:
          - image: "qgis/qgis:nightly"
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      LANG: C.UTF-8
      # a crash prints the Python stack of every thread
      PYTHONFAULTHANDLER: "1"
      # the images' system Python is marked externally managed (PEP 668)
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      # the tests import the checkout as the package cadex, as QGIS imports the plugin folder
      - uses: actions/checkout@v7
        with:
          path: cadex

      - uses: actions/download-artifact@v8
        with:
          name: cadex-release-zip
          path: dist

      # the tests that read the Excel files back with openpyxl are skipped without it
      - name: Install the optional test package
        run: python3 -m pip install --disable-pip-version-check openpyxl

      # one process per module: QGIS allows a single initQgis/exitQgis cycle per process
      - name: Run the test modules on the checkout
        run: python3 cadex/.github/scripts/run_tests.py cadex

      # the zip's files, with what the tests need from the checkout beside them
      - name: Run the test modules on the extracted zip
        run: |
          python3 -m zipfile -e dist/cadex.*.zip release
          cp -r cadex/test cadex/scripts cadex/.github cadex/CHANGELOG.md release/cadex/
          python3 cadex/.github/scripts/run_tests.py release/cadex

      - name: Load the zip in qgis_process
        run: python3 cadex/.github/scripts/qgis_process_smoke.py dist/cadex.*.zip qgis_process

  # schedule, tags and manual runs only: installing QGIS takes most of the job
  windows:
    name: tests (Windows, QGIS LTR)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    needs: zip
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          path: cadex

      - uses: actions/download-artifact@v8
        with:
          name: cadex-release-zip
          path: dist

      - name: Install QGIS from OSGeo4W
        shell: pwsh
        run: cadex\.github\scripts\install_qgis.ps1

      - name: Run the test modules and the qgis_process check
        shell: pwsh
        run: >-
          cadex\.github\scripts\windows_tests.ps1 -Plugin cadex
          -Zip (Get-Item dist\cadex.*.zip).FullName -QgisRoot C:\OSGeo4W

  # the checks plugins.qgis.org runs on an upload, and the oldest Python of a QGIS 3.34
  package:
    name: upload checks and Python 3.9
    needs: zip
    # setup-python has Python 3.9 for Ubuntu 22.04 and 24.04, not for later releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: cadex

      - uses: actions/download-artifact@v8
        with:
          name: cadex-release-zip
          path: dist

      - name: Extract the release zip
        run: unzip -q dist/cadex.*.zip -d "$RUNNER_TEMP/release"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      # the modules that start no QGIS, on the checkout
      - name: Run the pure test modules on Python 3.9
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python cadex/.github/scripts/run_tests.py cadex --pure

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the scanners
        run: python -m pip install --disable-pip-version-check bandit detect-secrets flake8

      # every test at every severity, a superset of the tests plugins.qgis.org selects
      - name: Bandit
        run: bandit -r "$RUNNER_TEMP/release/cadex"

      - name: detect-secrets
        working-directory: ${{ runner.temp }}/release
        run: |
          detect-secrets scan --all-files --exclude-files 'metadata\.txt' cadex \
            > "$RUNNER_TEMP/secrets.json"
          python - "$RUNNER_TEMP/secrets.json" <<'EOF'
          import json, sys
          found = json.load(open(sys.argv[1]))["results"]
          print(json.dumps(found, indent=1))
          sys.exit(1 if found else 0)
          EOF

      - name: flake8
        run: flake8 --max-line-length=120 "$RUNNER_TEMP/release/cadex"

      # the image and the command plugins.qgis.org checks an upload with. In --dry_run the
      # script exits 0 even when it reports something, so any output line naming a plugin
      # file fails the step.
      - name: Qt6 checker
        run: |
          docker run --rm -v "$RUNNER_TEMP/release:/plugin:ro" \
            ghcr.io/qgis/pyqgis4-checker:main-ubuntu \
            /usr/local/bin/pyqt5_to_pyqt6.py /plugin --dry_run 2>&1 | tee "$RUNNER_TEMP/qt6.log"
          if grep -F "/plugin/cadex/" "$RUNNER_TEMP/qt6.log"; then
            exit 1
          fi
